version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vollmed-mysql
    restart: always
    environment:
      MYSQL_DATABASE: vollmed_api
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vollmed-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vollmed-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vollmed_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: 12345678
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vollmed-network

volumes:
  mysql_data:

networks:
  vollmed-network:
    driver: bridge

